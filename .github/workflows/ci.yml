name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and two-process smoke tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: coop
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Meitou-Modding-Ecosystem/MeitouP2P
          ref: 2fa9c175414dc29e75fa05df62010f002d0d577a
          path: p2p
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 11.0.x
      - name: Download verified build fixtures
        shell: pwsh
        working-directory: coop
        run: ./tools/GetCIEngine.ps1 -Output (Join-Path $env:RUNNER_TEMP 'meitou-fixtures')
      - name: Build and run regressions
        shell: pwsh
        working-directory: coop
        run: ./tools/CI.ps1 -Connector ../p2p -Coop ../coop

  release-readiness:
    name: Release readiness
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python - <<'PY'
          import os
          results = os.environ['RESULTS'].split(',')
          if not results or any(result != 'success' for result in results):
              raise SystemExit('Validation failed, was cancelled, or was skipped')
          PY
